<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>omarchy-ubuntu: keep WOFF/WOFF2 web-font containers out of the desktop font set</description>
  <!-- Google Chrome >= 154 bundles a fontconfig snapshot (cache format 12, Fontations indexer) that
       writes ~/.cache/fontconfig/<hash>-le64.cache-12 and replaces <hash>-le64.cache-{9,10,11} by
       symlinks to it. For .woff/.woff2 files it stores placeholder patterns (file + fontwrapper only:
       no family, no charset). Ubuntu's fontconfig 2.17 reads them through the symlink; a pattern with
       nothing to mismatch wins every FcFontMatch(), and Qt 6.10's
       QFontEngineMultiFontConfig::shouldLoadFontEngineForCharacter() ignores the failed charset
       lookup and passes an uninitialised pointer (0xfefefefe, Qt's own trivial_auto_var_init_pattern)
       to FcCharSetHasChar: SIGSEGV in Quickshell or any Qt app (fixed upstream in Qt 80ddc8dee6, not
       in 6.10). Rejected files are dropped whichever cache they come from (FcConfigAddCache applies
       rejectfont). -->
  <selectfont>
    <rejectfont>
      <glob>*.woff</glob>
      <glob>*.woff2</glob>
      <glob>*.WOFF</glob>
      <glob>*.WOFF2</glob>
      <pattern><patelt name="fontwrapper"><string>WOFF</string></patelt></pattern>
      <pattern><patelt name="fontwrapper"><string>WOFF2</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
